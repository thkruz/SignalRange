---
name: Deploy Pipeline

on:
  # Production: Auto-deploy when main is updated
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================
  # PRODUCTION DEPLOYMENT (auto on main push)
  # ============================================
  build-production:
    name: Build Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      # Private submodule (src/private): read-only deploy key on thkruz/signal-range-private.
      # A deploy key cannot fetch the public repo, so checkout stays on the token and only the
      # submodule step uses SSH.
      - name: Set up SSH for private submodule
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_SUBMODULE_DEPLOY_KEY }}

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Build Application
        run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-production-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Set Artifact Name Output
        id: artifact
        run: echo "name=dist-production-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-production:
    name: Deploy to Production
    needs: build-production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.signalrange.space
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-production.outputs.artifact-name }}
          path: dist/

      # wrangler-action installs wrangler with the repo's packageManager (pnpm),
      # so pnpm must be on PATH even though this job installs nothing else.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc --env production

      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://app.signalrange.space" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
