---
name: Build Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'src/private'
  pull_request:
    branches:
      - main
      - develop
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'src/private'

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # PARALLEL QUALITY CHECKS
  # ============================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Run Biome
        run: pnpm run lint

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .github/workflows/
          config_file: .yamllint.yml
        continue-on-error: true

      - name: Lint Summary
        run: |
          echo "### Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "- Biome (lint + format): Passed" >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: TypeScript Type Check
        run: pnpm run typecheck

      - name: Type Check Summary
        run: |
          echo "### Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "TypeScript compilation: Passed" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # TEST SELECTION (PRs only)
  # ============================================

  select:
    name: Select Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      vitest: ${{ steps.select.outputs.vitest }}
      related: ${{ steps.select.outputs.related }}
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Select Tests
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/ci/select-tests.mjs --base "origin/${BASE_REF}" --json > selection.json
          jq -c . selection.json
          echo "full=$(jq -r '.full' selection.json)" >> "$GITHUB_OUTPUT"
          echo "vitest=$(jq -r '.vitest | join(" ")' selection.json)" >> "$GITHUB_OUTPUT"
          echo "related=$(jq -r '.related | join(" ")' selection.json)" >> "$GITHUB_OUTPUT"
          echo "e2e=$(jq -r '.e2e | join(" ")' selection.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Test selection"
            echo "- Base: origin/${BASE_REF}"
            echo "- Full run: $(jq -r '.full' selection.json)"
            echo "- Explicit vitest files: $(jq -r '.vitest | length' selection.json)"
            echo "- Changed source files (vitest related): $(jq -r '.related | length' selection.json)"
            echo "- E2E specs: $(jq -r '.e2e | length' selection.json)"
            echo ""
            echo "Reasons:"
            jq -r '.reasons[]? | "- " + (if type == "string" then . else tojson end)' selection.json
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: [select]
    if: ${{ !cancelled() && (needs.select.result == 'success' || needs.select.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      SEL_FULL: ${{ needs.select.outputs.full }}
      SEL_VITEST: ${{ needs.select.outputs.vitest }}
      SEL_RELATED: ${{ needs.select.outputs.related }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: 'America/New_York'

      - name: Decide Test Scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "$SEL_FULL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [ -n "$SEL_VITEST" ] || [ -n "$SEL_RELATED" ]; then
            echo "mode=selected" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "Unit tests: skipped, the selector chose no vitest files for this PR" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Selected Tests
        if: steps.scope.outputs.mode == 'selected'
        run: |
          # Call vitest directly: `pnpm test -- <args>` makes vitest ignore every argument after the `--`.
          if [ -n "$SEL_RELATED" ]; then
            pnpm exec vitest related --run $SEL_RELATED $SEL_VITEST --reporter=default --reporter=json --outputFile.json=selected-results.json
          else
            pnpm exec vitest run $SEL_VITEST --reporter=default --reporter=json --outputFile.json=selected-results.json
          fi
          if [ -f selected-results.json ]; then
            echo "Selected run: $(jq '.testResults | length' selected-results.json) test files" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Full Tests
        if: steps.scope.outputs.mode == 'full'
        run: pnpm exec vitest run

      # Coverage instrumentation slows the simulation-heavy suites past their timeouts, so it does not gate:
      # it runs on pushes to the long-lived branches only, with a longer timeout, and its result is informational.
      - name: Coverage (informational)
        if: steps.scope.outputs.mode == 'full' && github.event_name == 'push'
        continue-on-error: true
        run: >-
          pnpm exec vitest run --coverage --testTimeout=60000 --coverage.reporter=text-summary
          --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reporter=json

      - name: Upload Coverage Artifact
        if: steps.scope.outputs.mode == 'full' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test Summary
        if: steps.scope.outputs.mode != 'none'
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests (${{ steps.scope.outputs.mode }}): Passed" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "N/A")
            echo "Line coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          fi

  e2e-tests:
    name: E2E Tests
    needs: [select, lint, type-check, test, security-audit]
    if: >-
      !cancelled() && !failure() && ((github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-e2e')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        id: e2e
        env:
          SEL_FULL: ${{ needs.select.outputs.full }}
          SEL_E2E: ${{ needs.select.outputs.e2e }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "$SEL_FULL" = "true" ]; then
            pnpm run test:e2e
          elif [ -n "$SEL_E2E" ]; then
            echo "Selected specs: $SEL_E2E" >> "$GITHUB_STEP_SUMMARY"
            pnpm exec playwright test $SEL_E2E
          else
            echo "No e2e specs selected for this PR, skipping." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: E2E Test Summary
        if: always()
        run: |
          echo "### E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ steps.e2e.outcome }}" >> $GITHUB_STEP_SUMMARY
          if [ -d playwright-report ]; then
            echo "E2E tests completed. See artifact for details." >> $GITHUB_STEP_SUMMARY
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Audit (Critical Only)
        run: pnpm audit --audit-level=critical
        continue-on-error: false

      - name: Audit Report (All Levels)
        run: |
          echo "### Security Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pnpm audit --json | jq -r '
            "Vulnerabilities: " +
            (.metadata.vulnerabilities | to_entries | map("\(.key): \(.value)") | join(", "))
          ' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ============================================
  # BUILD (after quality checks pass)
  # ============================================

  build:
    name: Build
    needs: [lint, type-check, test, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Verify src/private is absent (OSS build)
        run: |
          if [ -n "$(ls -A src/private 2>/dev/null)" ]; then
            echo "ERROR: OSS build sees src/private contents"; exit 1
          fi

      - name: Build Application
        run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Build Summary
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "Build: Passed" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: dist-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SECURITY SCANS (after build)
  # ============================================

  secrets-scan:
    name: Secrets Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.88.0

      - name: Secrets Scan Summary
        if: success()
        run: |
          echo "### Secrets Scan" >> $GITHUB_STEP_SUMMARY
          echo "TruffleHog: No secrets detected" >> $GITHUB_STEP_SUMMARY

  codeql:
    name: CodeQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  # ============================================
  # DEPENDENCY REVIEW (PRs only)
  # ============================================

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
