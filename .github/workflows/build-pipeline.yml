---
name: Build Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # PARALLEL QUALITY CHECKS
  # ============================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Run ESLint
        run: npm run lint

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .github/workflows/
          config_file: .yamllint.yml
        continue-on-error: true

      - name: Lint Summary
        run: |
          echo "### Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: Passed" >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Type Check Summary
        run: |
          echo "### Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "TypeScript compilation: Passed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: 'America/New_York'

      - name: Run Tests with Coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Coverage Report to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          vite-config-path: ''
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Test Summary
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests: Passed" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo "N/A")
            echo "Line coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: NPM Audit (Critical Only)
        run: npm audit --audit-level=critical
        continue-on-error: false

      - name: NPM Audit Report (All Levels)
        run: |
          echo "### Security Audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --json | jq -r '
            "Vulnerabilities: " +
            (.metadata.vulnerabilities | to_entries | map("\(.key): \(.value)") | join(", "))
          ' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ============================================
  # BUILD (after quality checks pass)
  # ============================================

  build:
    name: Build
    needs: [lint, type-check, test, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node Project
        uses: ./.github/actions/setup-node-project

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Build Summary
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "Build: Passed" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: dist-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # PREVIEW DEPLOYMENT (PRs only)
  # ============================================

  preview-deploy:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --name signal-range-pr-${{ github.event.pull_request.number }} --config wrangler.jsonc

      - name: Find Existing Preview Comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- preview-deployment-comment -->'

      - name: Create or Update Preview Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- preview-deployment-comment -->
            ## :rocket: Preview Deployment Ready

            | Property | Value |
            |----------|-------|
            | **Preview URL** | https://signal-range-pr-${{ github.event.pull_request.number }}.workers.dev |
            | **Commit** | `${{ github.sha }}` |

            ---
            *This preview will be automatically deleted when the PR is closed.*

      - name: Preview Deploy Summary
        run: |
          echo "## Preview Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** https://signal-range-pr-${{ github.event.pull_request.number }}.workers.dev" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SECURITY SCANS (after build)
  # ============================================

  secrets-scan:
    name: Secrets Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.88.0

      - name: Secrets Scan Summary
        if: success()
        run: |
          echo "### Secrets Scan" >> $GITHUB_STEP_SUMMARY
          echo "TruffleHog: No secrets detected" >> $GITHUB_STEP_SUMMARY

  codeql:
    name: CodeQL
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ============================================
  # DEPENDENCY REVIEW (PRs only)
  # ============================================

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always
