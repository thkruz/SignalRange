name: 'Setup Node Project'
description: 'Setup pnpm, Node.js, cache dependencies, and install (call after checkout)'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    # pnpm must be on PATH before setup-node, otherwise `cache: pnpm` cannot
    # resolve the store directory. Version comes from `packageManager` in
    # package.json, so it stays in lockstep with local development.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    # --ignore-scripts is belt-and-braces: pnpm already gates postinstall
    # scripts behind the onlyBuiltDependencies allowlist in package.json.
    # Nothing in CI needs the wrangler/sharp native binaries.
    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
